<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DJ CRM Software — Windows Desktop Edition</title>
    <style>
        :root {
            --primary: #0EA5E9;
            --primary-hover: #0284C7;
            --bg: #F8FAFC;
            --surface: #FFFFFF;
            --border: #E2E8F0;
            --text: #0F172A;
            --text-muted: #64748B;
            --success: #10B981;
            --warning: #F59E0B;
            --danger: #EF4444;
        }

        [data-theme="dark"] {
            --primary: #38BDF8;
            --primary-hover: #0EA5E9;
            --bg: #0F172A;
            --surface: #1E293B;
            --border: #334155;
            --text: #F8FAFC;
            --text-muted: #94A3B8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* Top Desktop App Navigation Bar */
        .desktop-header {
            height: 48px;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 1.25rem;
            user-select: none;
            -webkit-app-region: drag;
        }

        .brand-section {
            display: flex;
            align-items: center;
            gap: 0.65rem;
        }

        .brand-icon {
            width: 26px;
            height: 26px;
            border-radius: 6px;
            background: linear-gradient(135deg, #0EA5E9 0%, #0284C7 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-weight: 700;
            font-size: 0.85rem;
        }

        .brand-name {
            font-weight: 700;
            font-size: 0.95rem;
            color: var(--text);
            letter-spacing: -0.01em;
        }

        .header-status {
            display: flex;
            align-items: center;
            gap: 1rem;
            -webkit-app-region: no-drag;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            font-size: 0.75rem;
            font-weight: 600;
            padding: 0.25rem 0.65rem;
            border-radius: 20px;
            background: rgba(16, 185, 129, 0.1);
            color: var(--success);
            border: 1px solid rgba(16, 185, 129, 0.2);
            transition: all 0.3s ease;
        }

        .status-badge.offline {
            background: rgba(245, 158, 11, 0.1);
            color: var(--warning);
            border-color: rgba(245, 158, 11, 0.25);
        }

        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background-color: currentColor;
        }

        .sync-badge {
            font-size: 0.75rem;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        /* Main Viewport Container */
        .desktop-viewport {
            flex: 1;
            position: relative;
            background: var(--bg);
            display: flex;
            flex-direction: column;
        }

        .loading-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            background: var(--bg);
            transition: opacity 0.3s ease;
        }

        .loader-spinner {
            width: 44px;
            height: 44px;
            border: 3px solid rgba(14, 165, 233, 0.2);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loader-title {
            font-weight: 700;
            font-size: 1.15rem;
            color: var(--text);
        }

        .loader-subtitle {
            font-size: 0.875rem;
            color: var(--text-muted);
        }

        iframe#crm-frame {
            width: 100%;
            height: 100%;
            border: none;
            display: none;
            flex: 1;
        }
    </style>
</head>
<body>
    <header class="desktop-header">
        <div class="brand-section">
            <div class="brand-icon">DJ</div>
            <span class="brand-name">DJ CRM Software</span>
            <span style="font-size: 0.72rem; color: var(--text-muted); margin-left: 0.5rem; background: var(--bg); padding: 2px 6px; border-radius: 4px; border: 1px solid var(--border);">Desktop v1.0.1</span>
        </div>

        <div class="header-status">
            <div class="status-badge" id="network-badge">
                <span class="status-dot"></span>
                <span id="network-text">Online</span>
            </div>

            <div class="sync-badge" id="sync-info">
                <span id="sync-icon">⚡</span>
                <span id="sync-text">Auto-sync active</span>
            </div>
        </div>
    </header>

    <main class="desktop-viewport">
        <div id="app-loading" class="loading-container">
            <div class="loader-spinner"></div>
            <div class="loader-title">DJ CRM Software</div>
            <div class="loader-subtitle" id="loader-status">Initializing local runtime supervisor...</div>
        </div>
        <!-- Frame pointing to dynamically allocated loopback micro-engine -->
        <iframe id="crm-frame" src="about:blank"></iframe>
    </main>

    <script>
        // Automatic Network Status Monitor
        function updateNetworkStatus() {
            const isOnline = navigator.onLine;
            const badge = document.getElementById('network-badge');
            const text = document.getElementById('network-text');
            const syncText = document.getElementById('sync-text');

            if (isOnline) {
                badge.className = 'status-badge';
                text.textContent = 'Online';
                syncText.textContent = 'Auto-sync active';
            } else {
                badge.className = 'status-badge offline';
                text.textContent = 'Offline Mode';
                syncText.textContent = 'Saving locally to SQLite';
            }
        }

        window.addEventListener('online', updateNetworkStatus);
        window.addEventListener('offline', updateNetworkStatus);
        updateNetworkStatus();

        // Resolve dynamic server URL from Tauri native backend
        async function initServerUrl() {
            const statusEl = document.getElementById('loader-status');
            const frame = document.getElementById('crm-frame');
            const loader = document.getElementById('app-loading');
            let serverUrl = null;

            for (let attempt = 1; attempt <= 30; attempt++) {
                try {
                    if (window.__TAURI__ && window.__TAURI__.core && window.__TAURI__.core.invoke) {
                        serverUrl = await window.__TAURI__.core.invoke('get_server_url');
                    } else if (window.__TAURI__ && window.__TAURI__.invoke) {
                        serverUrl = await window.__TAURI__.invoke('get_server_url');
                    }
                } catch (e) {
                    console.log(`IPC invoke attempt ${attempt} pending:`, e);
                }

                if (serverUrl && (serverUrl.startsWith('http://127.0.0.1:') || serverUrl.startsWith('http://localhost:'))) {
                    break;
                }
                await new Promise(r => setTimeout(r, 200));
            }

            // Fallback from query params if any
            if (!serverUrl) {
                const params = new URLSearchParams(window.location.search);
                const port = params.get('port');
                if (port) {
                    serverUrl = `http://127.0.0.1:${port}/dashboard.php`;
                }
            }

            if (serverUrl) {
                if (statusEl) statusEl.textContent = 'Launching application...';
                // Direct top-level navigation: ensures all session cookies are first-party and CSRF passes!
                window.location.replace(serverUrl);
            } else {
                if (statusEl) {
                    statusEl.innerHTML = '<span style="color:var(--danger)">Runtime failed to respond. Please restart application.</span>';
                }
            }
        }
        initServerUrl();
    </script>
</body>
</html>
