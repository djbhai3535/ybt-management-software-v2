[package]
name = "ybt-management-software"
version = "1.0.0"
description = "YBT Management Software — Commercial Windows Desktop CRM Edition"
authors = ["YBT Development Team"]
license = "Proprietary"
repository = "https://github.com/YouBTech01/ybt-management-software.git"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.31", features = ["bundled"] }
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1.0", features = ["full"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
